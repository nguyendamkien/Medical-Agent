server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API → backend. Frontend và API chung địa chỉ nên không cần CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # SSE (/api/chat/stream): gửi từng đoạn ngay, không gom lại.
        proxy_buffering off;
        proxy_cache off;
        # Một câu hỏi có thể mất vài chục giây (rerank trên CPU), lần đầu còn phải tải model.
        proxy_read_timeout 600s;
    }

    # React là SPA: đường dẫn lạ trả về index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
